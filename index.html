<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./logo.png" rel="icon" type="image/png">
    <title>FireBase</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./js/app.js" type="module"></script>
</head>
<body>
    <main x-data="boot">
        <template x-if="viewOne">
            <section class="min-h-screen min-w-screen bg-slate-100 text-slate-800 z-10 top-0 fixed">
                <div class="min-h-screen flex items-center justify-center px-4 py-8">
                    <div class="w-full max-w-md rounded-2xl bg-white p-8 sm:p-10 shadow-xl shadow-slate-200/70 text-center">
                        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-indigo-50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7l7-4z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/>
                            </svg>
                        </div>
                        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Human Verification</h1>
                        <p class="mt-3 text-sm leading-6 text-slate-500">Please complete the verification below to confirm that you are human.</p>
                        <p x-show="status" x-text="status" x-cloak role="status" aria-live="polite" class="mt-5 text-sm" :class="captchVarified ? 'text-green-600' : 'text-slate-500'"></p>
                        <div class="mt-7 flex justify-center">
                            <div id="recaptcha-container" class="min-h-[70px]"></div>
                        </div>
                        <p class="mt-6 text-xs text-slate-400">Protected by <a class="underline" href=https://cloud.google.com/security/products/recaptcha>Google reCAPTCHA</a></p>
                    </div>
                </div>
            </section>
        </template>
        <template x-if="viewTwo">
            <section class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
                <div class="w-full max-w-md bg-white rounded-xl shadow-md p-8">
                    <div x-show="loading" class="flex flex-col items-center justify-center py-6">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
                        <p class="text-sm text-gray-500 mt-2">Processing...</p>
                    </div>
                    <div x-show="!user && !loading" x-cloak>
                        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6" x-text="isSignUp ? 'Create an Account' : 'Welcome Back'"></h2>
                        <div x-show="errorMessage" x-text="errorMessage" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-4 border border-red-200"></div>
                        <button @click="popupsignin()" class="cursor-pointer flex gap-2 hover:bg-gray-50 items-center justify-center mb-4 outline outline-gray-400 px-3 py-2.5 rounded-lg shadow-sm text-gray-500 text-sm transition-colors w-full">
                            <img alt=Google height=20 src=https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/google/default.svg width=24> Continue With Google
                        </button>
                        <h1 class="text-xs text-center text-gray-400 mb-2">OR</h1>
                        <form @submit.prevent="handleSubmit" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                <input type="email" x-model="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" x-model="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors cursor-pointer" x-text="isSignUp ? 'Sign Up' : 'Log In'"></button>
                        </form>
                        <p class="text-sm text-center text-gray-600 mt-6">
                            <span x-text="isSignUp ? 'Already have an account?' : 'Don\'t have an account?'"></span>
                            <button @click="isSignUp = !isSignUp; errorMessage = ''" class="text-indigo-600 hover:underline font-medium ml-1 cursor-pointer">
                                <span x-text="isSignUp ? 'Log In' : 'Sign Up'"></span>
                            </button>
                        </p>
                        <template x-if="!isSignUp">
                            <p class="text-xs text-center text-gray-500 mt-3">
                                <button @click="test()" class="hover:underline font-medium ml-1 cursor-pointer">
                                    <span x-text="email && password ? 'Enter Your Own Details ?' : 'Continue with Test Enrollment ?'"></span>
                                </button>
                            </p>
                        </template>
                    </div>
                </div>
            </section>
        </template>
        <template x-if="viewThree">
            <section class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
                <div class="w-full max-w-md bg-white rounded-xl shadow-md p-8">
                    <div x-show="loading" class="flex flex-col items-center justify-center py-6">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
                        <p class="text-sm text-gray-500 mt-2">Processing...</p>
                    </div>
                    <div x-show="user && !loading" x-cloak class="text-center space-y-6">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full text-green-600 mb-2">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">Successfully Signed In!</h2>
                        <div class="bg-gray-50 rounded-lg p-4 text-left border border-gray-200">
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">User Account Email</p>
                            <p class="text-sm font-medium text-gray-800 break-all" x-text="user?.email"></p>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-3">Firebase UID</p>
                            <p class="text-font-mono text-xs text-gray-600 break-all" x-text="user?.uid"></p>
                        </div>
                        <button @click="logout" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 px-4 rounded-lg transition-colors cursor-pointer">Log Out</button>
                    </div>
                </div>
            </section>
        </template>
        <section id="cookie" class="min-h-screen min-w-screen bg-gray-900/20 text-slate-800 fixed z-20 top-0 backdrop-blur-md" style="display: none;">
            <div class="min-h-screen flex items-center justify-center px-4 py-8">
                <div class="w-full max-w-sm rounded-2xl bg-white p-6 sm:p-10 shadow-xl shadow-slate-400/30 text-center outline outline-gray-300">
                    <h1 class="text-3xl font-bold tracking-tight text-slate-900">Accept Cookies?</h1>
                    <p class="mt-3 text-sm leading-6 text-slate-500">Would tou like to accept cookies for better experience?</p>
                    <div class="mt-5 flex justify-center grid-2 gap-3">
                        <button id="notnow" class="w-full bg-gray-200 hover:bg-gray-100 text-gray-900 font-medium py-2.5 px-3 rounded-lg transition-colors cursor-pointer">Not now</button>
                        <button id="allow" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 px-3 rounded-lg transition-colors cursor-pointer">Allow</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <style>[x-cloak] {display: none !important;}body {-webkit-user-select: none;-moz-user-select: none;-ms-user-select: none;user-select: none;}</style>
</body>
</html>
